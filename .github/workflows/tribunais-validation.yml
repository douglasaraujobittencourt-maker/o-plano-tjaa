name: Validate tribunais
on:
  push:
    branches: [tribunais-tjgo-tjdft, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/auditar-tribunais.mjs
      - run: bun test src/lib/planner-api.test.js
      - run: bun run build
