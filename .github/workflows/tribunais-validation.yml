name: Validate tribunais
on:
  push:
    branches: [tribunais-tjgo-tjdft, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/auditar-tribunais.mjs
      - run: npm run build
